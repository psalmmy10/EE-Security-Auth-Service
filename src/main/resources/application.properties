# =====================================================================
# Shared configuration for ALL environments.
# Environment-specific values live in application-{dev|staging|prod}.properties
# =====================================================================

# ---- Active environment: dev | staging | prod ----
# Change this line to switch locally. On a server, the SPRING_PROFILES_ACTIVE
# environment variable overrides it automatically (no file edit needed).
spring.profiles.active=dev

spring.application.name=pay-auth-service

# Virtual threads for Tomcat request handling and @Scheduled
spring.threads.virtual.enabled=true

# ---- Connection pool (the real concurrency limit for DB work) ----
spring.datasource.hikari.pool-name=auth-hikari
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=20000

# ---- JPA / Flyway ----
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- Jackson ----
# Rejects unknown fields, e.g. a sneaky {"role":"ADMIN"} on signup
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.mvc.problemdetails.enabled=false

# ---- Server ----
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

# ---- JWT ----
app.security.jwt.access-token-ttl=15m
app.security.jwt.refresh-token-ttl=7d
# Hard cap on one login however often it is refreshed, and concurrent logins per user
app.security.jwt.session-absolute-ttl=30d
app.security.jwt.max-active-sessions=5

# ---- Keystore (used by staging/prod) ----
app.security.keys.keystore.location=${KEYSTORE_LOCATION:file:/run/secrets/auth-keys.p12}
app.security.keys.keystore.password=${KEYSTORE_PASSWORD:}
app.security.keys.keystore.jwt-signing-alias=jwt-signing
app.security.keys.keystore.payload-encryption-alias=payload-encryption

# ---- End-to-end payload encryption ----
app.security.e2e.enabled=true
app.security.e2e.replay-window=2m
app.security.e2e.max-tracked-nonces=500000

# ---- Brute-force lockout ----
app.security.lockout.max-attempts=5
app.security.lockout.lock-duration=15m

# ---- Password hashing ----
app.security.password.bcrypt-strength=12
# 0 = number of CPU cores
app.security.password.max-concurrent-hashes=${PASSWORD_HASH_CONCURRENCY:0}
app.security.password.acquire-timeout=2s

# ---- Async audit ----
app.async.audit-concurrency-limit=64

# ---- Admin bootstrap (off unless a profile enables it) ----
app.bootstrap.admin.enabled=false
app.bootstrap.admin.first-name=System
app.bootstrap.admin.last-name=Administrator

# ---- Logging ----
logging.pattern.level=%5p [cid:%X{correlationId:-}]
logging.level.root=INFO
logging.level.org.springframework.security=WARN

# ---- Transport ----
# true in staging/prod: requests not received over HTTPS (X-Forwarded-Proto) are rejected
app.security.require-https=false

# ---- Shared security state (replay nonces, rate-limit counters) ----
# memory = one instance only; redis = required when running more than one instance
app.security.state-store=${STATE_STORE:memory}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=2s
# Turn on (true) when STATE_STORE=redis so health reflects Redis
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}

# ---- Rate limiting per client IP (before any BCrypt/RSA work) ----
app.security.rate-limit.enabled=true
app.security.rate-limit.login.limit=10
app.security.rate-limit.login.window=1m
app.security.rate-limit.signup.limit=5
app.security.rate-limit.signup.window=10m
app.security.rate-limit.refresh.limit=30
app.security.rate-limit.refresh.window=1m
