# =====================================================================
# DEV - local machine
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pay_auth}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Adesanya+123.}

# This service is the issuer; this is just the label in the token's "iss" claim
app.security.jwt.issuer=http://localhost:8080
app.security.jwt.audience=pay-api-dev

# ephemeral = in-memory keys (default). Set KEY_SOURCE=keystore to test the real keystore in dev
app.security.keys.source=${KEY_SOURCE:ephemeral}

# Set E2E_ENABLED=false to test plain JSON in Postman (dev only)
app.security.e2e.enabled=${E2E_ENABLED:false}

app.security.lockout.max-attempts=10
app.security.lockout.lock-duration=1m
app.security.password.bcrypt-strength=10

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

app.bootstrap.admin.enabled=true
app.bootstrap.admin.email=${ADMIN_BOOTSTRAP_EMAIL:admin@pay.local}
app.bootstrap.admin.password=${ADMIN_BOOTSTRAP_PASSWORD:DevAdmin#Password2026}

management.endpoint.health.show-details=always

logging.level.com.pay.auth=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Relaxed limits for local testing
app.security.rate-limit.login.limit=60
app.security.rate-limit.signup.limit=60
app.security.jwt.max-active-sessions=20
