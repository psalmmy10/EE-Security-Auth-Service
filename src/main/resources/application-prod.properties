# =====================================================================
# PROD - no defaults; every value must come from the environment.
# =====================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.security.jwt.issuer=${JWT_ISSUER}
app.security.jwt.audience=${JWT_AUDIENCE}

app.security.keys.source=keystore
app.security.e2e.enabled=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Enable for the first deploy only, then set back to false
app.bootstrap.admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.bootstrap.admin.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.bootstrap.admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}

logging.level.root=WARN
logging.level.com.banffpay.auth=INFO