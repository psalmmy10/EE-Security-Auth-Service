# =====================================================================
# STAGING - production-like. Values come from environment variables.
# =====================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.security.jwt.issuer=${JWT_ISSUER:https://auth-staging.banffpay.com}
app.security.jwt.audience=${JWT_AUDIENCE:banffpay-api-staging}

app.security.keys.source=keystore
app.security.e2e.enabled=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.bootstrap.admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.bootstrap.admin.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.bootstrap.admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}

logging.level.com.pay.auth=INFO

# Reject anything not received over HTTPS (TLS terminates at the load balancer)
app.security.require-https=true

# Actuator (health + prometheus) on an INTERNAL port that must never be exposed publicly
management.server.port=${MANAGEMENT_PORT:8081}
